# Only the first-party RALLO viewer may be framed by this site.
map $uri $szkl_frame_ancestors {
    default "'none'";
    ~^/demos/rallo/ "'self'";
}
map $uri $szkl_frame_options {
    default "DENY";
    ~^/demos/rallo/ "SAMEORIGIN";
}

map $arg_lang $szkl_html_lang {
    default "en";
    zh      "zh-CN";
}

map $arg_lang $szkl_og_locale {
    default "en_US";
    zh      "zh_CN";
}

map $arg_lang $szkl_meta_title {
    default "SZKL — Scientific Intelligence That Compounds";
    zh      "SZKL — 让科研智能持续积累";
}

map $arg_lang $szkl_meta_description {
    default "Shenzhen Knowledge Labs is the company behind Pulse, building trusted intelligence systems for scientific work.";
    zh      "深圳知识实验室是 Pulse 背后的公司，致力于为科研工作构建可信的智能系统。";
}

map $arg_lang $szkl_canonical_url {
    default "https://www.szkl.com/";
    zh      "https://www.szkl.com/?lang=zh";
}

server {
    listen 80;
    listen [::]:80;

    server_name szkl.com www.szkl.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.szkl.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name szkl.com;

    ssl_certificate /etc/letsencrypt/live/www.szkl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.szkl.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.szkl.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.szkl.com;

    root /var/www/szkl-releases/current;
    index index.html;
    autoindex off;

    ssl_certificate /etc/letsencrypt/live/www.szkl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.szkl.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    sub_filter_once off;
    sub_filter '__HTML_LANG__' $szkl_html_lang;
    sub_filter '__OG_LOCALE__' $szkl_og_locale;
    sub_filter '__META_TITLE__' $szkl_meta_title;
    sub_filter '__META_DESCRIPTION__' $szkl_meta_description;
    sub_filter '__CANONICAL_URL__' $szkl_canonical_url;
    sub_filter '__SITE_ORIGIN__' 'https://www.szkl.com';

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors $szkl_frame_ancestors; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' https://d8j0ntlcm91z4.cloudfront.net; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options $szkl_frame_options always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    location = /about-us {
        try_files /index.html =404;
    }

    location = /about-us/ {
        return 301 /about-us$is_args$args;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\nSitemap: https://www.szkl.com/sitemap.xml\n";
    }

    location = /sitemap.xml {
        default_type application/xml;
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9" xmlns:xhtml="http://www.w3.org/1999/xhtml">
  <url>
    <loc>https://www.szkl.com/</loc>
    <xhtml:link rel="alternate" hreflang="en" href="https://www.szkl.com/" />
    <xhtml:link rel="alternate" hreflang="zh-CN" href="https://www.szkl.com/?lang=zh" />
  </url>
  <url>
    <loc>https://www.szkl.com/?lang=zh</loc>
    <xhtml:link rel="alternate" hreflang="en" href="https://www.szkl.com/" />
    <xhtml:link rel="alternate" hreflang="zh-CN" href="https://www.szkl.com/?lang=zh" />
  </url>
</urlset>
';
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}