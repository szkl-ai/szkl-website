name: Production build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_ORIGIN: https://www.szkl.com
          SITE_INDEXING: allow
      - name: Validate public output
        run: |
          test -s dist/client/index.html
          test -s dist/client/people/michael/index.html
          test -s dist/client/demos/rallo/i18n.js
          test -s dist/client/media/pheno-high-throughput.mp4
